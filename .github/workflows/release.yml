name: Build and Release ZIP

on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat << EOF > .env
          # VITE prefix needed for Vite to load these variables

          ## MODE
          # ENVIRONMENT FOR TESTING MODE: TEST | PROD
          VITE_MODE=PROD

          ## PORTS
          VITE_BACKEND_PORT=8000 # BACKEND PORT
          VITE_FRONTEND_PORT=3000 # FRONTEND PORT, USED IN TEST MODE ONLY

          ## WEBSOCKET
          VITE_WS_RECONNECT_INTERVAL=5000 # WEBSOCKET RECONNECT INTERVAL IN MS

          ## SERIAL
          VITE_DEFAULT_BAUDRATE=115200 # DEFAULT SERIAL BAUDRATE DISPLAYED IN UI

          ## PLOTTING
          VITE_MAX_DATA_POINTS=50 # MAX DATA POINTS TO STORE FOR PLOTTING/TELEMETRY

          ## BACKEND
          # FAKE PACKET GENERATION IS DISABLED WITH VITE_MODE=PROD
          PACKET_FREQUENCY=20 # FREQUENCY OF TELEMETRY PACKETS SENT OVER WEBSOCKETS IN HZ (APPLIES TO FAKE PACKETS TOO)
          TESTING_COM_PORT=COM1 # COM PORT FOR GENERATING FAKE PACKETS
          TESTING_COM_BAUDRATE=115200 # BAUDRATE FOR GENERATING FAKE PACKETS
          EOF

      - name: Build Vite frontend
        run: npm run build

      - name: Create ZIP
        run: |
          mkdir release
          cp -r dist backend .env release/
          cd release
          zip -r ../coheteros-gsui.zip .

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: coheteros-gsui.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
