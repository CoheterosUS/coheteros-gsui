name: Build and Release ZIP

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build

      - name: Create ZIP
        run: |
          mkdir release
          cp -r dist backend release/
          cd release
          zip -r ../coheteros-gsui.zip .

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: coheteros-gsui.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
